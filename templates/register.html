<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Codify</title>
    <style>
        /* Reset and basic styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1d1f27; /* Dark coding theme */
            color: #eee;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            width: 100%;
            padding: 30px;
            background: #2c2f36;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #61dafb;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
            color: #61dafb;
        }

        input[type="text"],
        input[type="password"] {
            padding: 12px;
            margin-bottom: 15px;
            border: none;
            border-radius: 5px;
            background: #1b1e23;
            color: #eee;
        }

        button {
            padding: 12px;
            background-color: #61dafb;
            color: #1d1f27;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #4db8e5;
        }

        p {
            text-align: center;
            margin-top: 15px;
        }

        a {
            color: #61dafb;
            text-decoration: none;
            transition: color 0.3s;
        }

        a:hover {
            color: #4db8e5;
        }

        /* Optional subtle animation for inputs */
        input:focus {
            outline: none;
            background: #33363e;
            box-shadow: 0 0 5px #61dafb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Register for Codify</h2>
        <form method="POST" action="{{ url_for('register') }}">
            <label for="username">Username:</label>
            <input type="text" name="username" id="username" required>

            <label for="password">Password:</label>
            <input type="password" name="password" id="password" required>

            <button type="submit">Register</button>
        </form>

        <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
    </div>
</body>
</html>
